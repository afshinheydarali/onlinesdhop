name: CI
on:
  pull_request:
  push:
    branches: [main, 'codex/**', 'feature/telegram-order-bot']
jobs:
  verify:
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: onlineshop_test
          POSTGRES_USER: onlineshop_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['15432:5432']
        options: >-
          --health-cmd "pg_isready -U onlineshop_test -d onlineshop_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://onlineshop_test@127.0.0.1:15432/onlineshop_test
      TEST_DATABASE_URL: postgresql+asyncpg://onlineshop_test@127.0.0.1:15432/onlineshop_test
      JWT_SECRET: ci-only-synthetic-secret-replaced-per-run
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pg_dump --version && pg_restore --version && createdb --version
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt -c requirements-lock.txt
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -B -m unittest discover -v
      - run: ruff check order_bot backend tests scripts migrations
      - run: mypy order_bot backend
      - run: python -m pip check
